# Netlify 設定 — 株式会社オールライト コーポレートサイト
# 静的サイト。ビルド時に社内アプリ(Supabase)から現場レポートを自動生成します。
# ※ Supabase から取得するには Netlify の環境変数に
#    SUPABASE_URL / SUPABASE_ANON_KEY を設定してください（未設定でもビルドは成功します）。

[build]
  publish = "."
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

# セキュリティ関連ヘッダ
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# CSS / JS は毎回更新を確認（更新が即反映されるように）
[[headers]]
  for = "/assets/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# 画像・写真・フォント等は長期キャッシュ（変わらないため）
[[headers]]
  for = "/assets/photos/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/assets/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800"
